<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الذكاء الاصطناعي العقاري</title>
  <style>
    /* الإعدادات العامة للموقع */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* حاوية الأزرار السفلية */
    .bottom-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    /* تحسين تصميم الأزرار السفلية */
    .bottom-button {
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* تأثير عند تمرير المؤشر */
    .bottom-button:hover {
      background: linear-gradient(135deg, #0b5ed7, #084298);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(13, 110, 253, 0.35);
      color: #ffffff;
    }

    /* تأثير عند الضغط */
    .bottom-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(13, 110, 253, 0.2);
    }
  </style>
</head>
<body>

  <!-- الأزرار السفلية -->
  <div class="bottom-actions">
    <!-- تم استبدال زر GitHub بـ Innovision -->
    <a href="https://ahmedvall70.github.io/Innovision" target="_blank" class="bottom-button">
      Innovision
    </a>

    <!-- الزر الثاني كما هو -->
    <button type="button" class="bottom-button" onclick="alert('تم تفعيل خدمة الذكاء الاصطناعي')">
      بدء التحليل العقاري
    </button>
  </div>

</body>
</html>
