name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to keep project active
        run: |
          curl -X GET "https://[YOUR_PROJECT_REF].supabase.co/rest/v1/[YOUR_TABLE_NAME]?select=count" \
          -H "apikey: [YOUR_SUPABASE_ANON_KEY]" \
          -H "Authorization: Bearer [YOUR_SUPABASE_ANON_KEY]"
